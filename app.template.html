<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>PHOTO → WORLD</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#080c14; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
         color:#e8e4dc; -webkit-user-select:none; user-select:none; }
  #stage { position:relative; width:100%; height:100%; overflow:hidden; }
  #view { position:absolute; inset:0; width:100%; height:100%; display:block;
          image-rendering:pixelated; image-rendering:crisp-edges; }

  #fade { position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
          z-index:5; pointer-events:none; opacity:0; }
  #fx { position:absolute; inset:0; pointer-events:none; }
  #scan { position:absolute; inset:0; opacity:.22;
    background:repeating-linear-gradient(180deg,rgba(0,0,0,.34) 0px,rgba(0,0,0,.34) 1px,transparent 1px,transparent 3px);
    mix-blend-mode:multiply; }
  #vig { position:absolute; inset:0;
    background:radial-gradient(ellipse 84% 80% at 50% 48%,transparent 46%,rgba(6,10,18,.5) 100%); }

  #hud { position:absolute; inset:0; pointer-events:none; padding:12px 14px; z-index:8; }
  #badge { display:inline-flex; align-items:center; gap:7px;
    background:rgba(10,16,26,.6); border:1px solid rgba(200,190,175,.18);
    border-radius:6px; padding:5px 9px; font-size:10px; letter-spacing:.1em; font-weight:500; }
  #dot { width:6px; height:6px; border-radius:50%; background:#7ad0a8; box-shadow:0 0 8px #7ad0a8; }
  #dot.live { background:#e2b34a; box-shadow:0 0 8px #e2b34a; animation:pulse 1.1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

  #stats { position:absolute; right:14px; top:12px; text-align:right; font-size:10.5px; line-height:1.75;
    background:rgba(10,16,26,.52); border:1px solid rgba(200,190,175,.14); border-radius:6px;
    padding:7px 9px; color:#b9b3a8; font-variant-numeric:tabular-nums; }
  #stats b { color:#e8e4dc; font-weight:500; }

  #cross { position:absolute; left:50%; top:50%; width:5px; height:5px; margin:-2.5px 0 0 -2.5px;
    border-radius:50%; background:rgba(255,255,255,.6); box-shadow:0 0 4px rgba(0,0,0,.9); }

  #panelUI { position:absolute; left:12px; bottom:12px; width:196px; pointer-events:auto;
    background:rgba(9,14,22,.78); border:1px solid rgba(200,190,175,.16);
    border-radius:8px; padding:10px 11px 12px; backdrop-filter:blur(8px); }
  #panelUI .row { display:flex; align-items:center; justify-content:space-between; margin-bottom:9px; }
  #panelUI .lab { font-size:10.5px; letter-spacing:.1em; color:#a9a294; }
  #panelUI .val { font-size:10.5px; color:#e8e4dc; font-variant-numeric:tabular-nums; }
  .sw { position:relative; width:34px; height:18px; border-radius:9px; background:rgba(200,190,175,.2);
        border:1px solid rgba(200,190,175,.28); cursor:pointer; transition:.18s; flex:none; }
  .sw i { position:absolute; left:2px; top:2px; width:12px; height:12px; border-radius:50%;
          background:#8b8578; transition:.18s; }
  .sw.on { background:rgba(226,179,74,.32); border-color:rgba(226,179,74,.7); }
  .sw.on i { left:18px; background:#e2b34a; box-shadow:0 0 6px rgba(226,179,74,.8); }
  #sliders { transition:opacity .2s; }
  #sliders.off { opacity:.32; pointer-events:none; }
  input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:16px; background:transparent; margin:2px 0 8px; }
  input[type=range]::-webkit-slider-runnable-track { height:2px; background:rgba(200,190,175,.24); border-radius:2px; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:12px; height:12px; margin-top:-5px;
    border-radius:50%; background:#e2b34a; border:none; }
  input[type=range]::-moz-range-track { height:2px; background:rgba(200,190,175,.24); }
  input[type=range]::-moz-range-thumb { width:12px; height:12px; border:none; border-radius:50%; background:#e2b34a; }
  #panelUI .cap { font-size:9.5px; color:#6f7787; letter-spacing:.08em; margin-top:6px; line-height:1.6; }

  #thumb { position:absolute; right:12px; bottom:12px; width:82px; padding:4px;
    background:rgba(10,16,26,.6); border:1px solid rgba(200,190,175,.16); border-radius:6px; }
  #thumb img { width:100%; display:block; border-radius:3px; }
  #thumb div { font-size:8.5px; letter-spacing:.14em; color:#7b8595; text-align:center; margin-top:3px; }
  #again { position:absolute; right:12px; bottom:130px; pointer-events:auto; cursor:pointer;
    background:rgba(10,16,26,.62); border:1px solid rgba(220,210,195,.28); color:#e8e4dc;
    border-radius:5px; padding:5px 9px; font-size:10.5px; letter-spacing:.06em; font-family:inherit; }

  #panel { position:absolute; inset:0; z-index:30; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:24px 20px; text-align:center;
    background:linear-gradient(180deg,#101827 0%,#090d15 62%,#06090f 100%); }
  #panel h1 { font-size:clamp(22px,5.2vw,38px); font-weight:500; letter-spacing:.18em; margin-bottom:8px; }
  #panel .sub { font-size:10.5px; letter-spacing:.28em; color:#8f9aab; margin-bottom:22px; }
  #pick { display:inline-flex; align-items:center; gap:8px; cursor:pointer;
    padding:12px 22px; border-radius:8px; border:1px solid rgba(226,179,74,.55);
    background:rgba(226,179,74,.1); color:#f0e2c4; font-size:13px; letter-spacing:.1em;
    pointer-events:auto; margin-bottom:8px; }
  #pick:active { background:rgba(226,179,74,.2); }
  #drop { width:min(330px,84vw); padding:18px; margin-top:10px;
    border:1px dashed rgba(200,190,175,.28); border-radius:9px;
    font-size:11px; color:#8f9aab; line-height:1.9; }
  #drop:hover, #drop.over { border-color:rgba(226,179,74,.75); color:#d8d2c6; }
  #examples { display:flex; gap:9px; margin-top:18px; }
  #examples img { width:56px; height:56px; object-fit:cover; border-radius:5px; cursor:pointer;
    border:1px solid rgba(200,190,175,.22); opacity:.8; transition:.18s; }
  #examples img:hover { opacity:1; border-color:rgba(226,179,74,.7); }
  #examples-note { font-size:9.5px; color:#6f7787; letter-spacing:.18em; margin-top:8px; }
  #panel .foot { position:absolute; bottom:18px; font-size:9.5px; color:#5d6675; letter-spacing:.14em; }

  #busy { position:absolute; inset:0; z-index:25; display:none; flex-direction:column;
    align-items:center; justify-content:center; background:rgba(6,9,15,.93); }
  #busy .t { font-size:11px; letter-spacing:.26em; color:#cfc8bb; margin-bottom:12px; }
  #bar { width:min(240px,68vw); height:2px; background:rgba(200,190,175,.16); overflow:hidden; }
  #bar i { display:block; height:100%; width:0%; background:#e2b34a; transition:width .2s; }
  #busy .s { font-size:9.5px; color:#6f7787; margin-top:10px; letter-spacing:.1em; height:13px; }
  canvas#prev { display:none; }
  #file { display:none; }

  @media (max-width:720px) {
    #panelUI { left:8px; bottom:8px; width:164px; padding:8px 9px 9px; }
    #thumb { width:60px; right:8px; bottom:8px; }
    #again { right:8px; bottom:104px; }
    #stats { font-size:9.5px; padding:6px 8px; right:8px; top:8px; }
    #badge { font-size:9px; padding:4px 7px; }
  }
</style>

</div>

<script>
(function () {
  'use strict';

  var HMAX = 28;
  var PATCH = 24;
  var WORLD = 512;
  var SCALE = 8;
  var PATCH_ROW = 18;
  var PX = 256, PZ = 400;

  var heights = new Float32Array(WORLD * WORLD);
  var baseH = new Float32Array(WORLD * WORLD);
  var cR = new Uint8ClampedArray(WORLD * WORLD);
  var cG = new Uint8ClampedArray(WORLD * WORLD);
  var cB = new Uint8ClampedArray(WORLD * WORLD);
  var cR0 = new Uint8ClampedArray(WORLD * WORLD);
  var cG0 = new Uint8ClampedArray(WORLD * WORLD);
  var cB0 = new Uint8ClampedArray(WORLD * WORLD);

  var view = document.getElementById('view');
  var vctx = view.getContext('2d');
  var RW = 0, RH = 0, imgData = null, buf32 = null, projScale = 0;
  var quality = 1, qAvg = 16, qTimer = 0;

  /* ---------------- 模型 ---------------- */
  var W = {};
  function b64f32(s) {
    var bin = atob(s), n = bin.length, u = new Uint8Array(n);
    for (var i = 0; i < n; i++) u[i] = bin.charCodeAt(i);
    return new Float32Array(u.buffer);
  }
  for (var wk in MODEL.w) W[wk] = b64f32(MODEL.w[wk]);

  function conv(inp, IH, IW, IC, wk, bias, OC, stride) {
    var OH = ((IH + 2 - 3) / stride | 0) + 1;
    var OW = ((IW + 2 - 3) / stride | 0) + 1;
    var out = new Float32Array(OH * OW * OC);
    var K = IC * 9;
    for (var oy = 0; oy < OH; oy++) {
      for (var ox = 0; ox < OW; ox++) {
        var o = (oy * OW + ox) * OC;
        for (var ky = 0; ky < 3; ky++) {
          var iy = oy * stride + ky - 1;
          if (iy < 0 || iy >= IH) continue;
          for (var kx = 0; kx < 3; kx++) {
            var ix = ox * stride + kx - 1;
            if (ix < 0 || ix >= IW) continue;
            var ib = (iy * IW + ix) * IC;
            var wb = (ky * 3 + kx) * IC;
            for (var ci = 0; ci < IC; ci++) {
              var v = inp[ib + ci];
              if (v === 0) continue;
              var wrow = wb + ci;
              for (var co = 0; co < OC; co++) out[o + co] += v * wk[co * K + wrow];
            }
          }
        }
        for (var c2 = 0; c2 < OC; c2++) out[o + c2] += bias[c2];
      }
    }
    return { d: out, h: OH, w: OW, c: OC };
  }
  function relu(t) { for (var i = 0; i < t.d.length; i++) if (t.d[i] < 0) t.d[i] = 0; return t; }
  function up2(t) {
    var out = new Float32Array(t.h * 2 * t.w * 2 * t.c);
    for (var y = 0; y < t.h; y++) {
      for (var x = 0; x < t.w; x++) {
        var s = (y * t.w + x) * t.c;
        for (var dy = 0; dy < 2; dy++) {
          for (var dx = 0; dx < 2; dx++) {
            var o = ((y * 2 + dy) * t.w * 2 + (x * 2 + dx)) * t.c;
            for (var c = 0; c < t.c; c++) out[o + c] = t.d[s + c];
          }
        }
      }
    }
    return { d: out, h: t.h * 2, w: t.w * 2, c: t.c };
  }
  function sig(t) { for (var i = 0; i < t.d.length; i++) t.d[i] = 1 / (1 + Math.exp(-t.d[i])); return t; }

  function infer(pix) {
    var x = { d: pix, h: 96, w: 96, c: 3 };
    x = relu(conv(x.d, x.h, x.w, x.c, W.c1w, W.c1b, 16, 2));
    x = relu(conv(x.d, x.h, x.w, x.c, W.c2w, W.c2b, 32, 2));
    x = relu(conv(x.d, x.h, x.w, x.c, W.c3w, W.c3b, 48, 2));
    x = relu(conv(x.d, x.h, x.w, x.c, W.c4w, W.c4b, 64, 2));
    x = relu(conv(up2(x).d, x.h * 2, x.w * 2, x.c, W.d1w, W.d1b, 48, 1));
    x = relu(conv(up2(x).d, x.h * 2, x.w * 2, x.c, W.d2w, W.d2b, 32, 1));
    var hh = sig(conv(x.d, x.h, x.w, x.c, W.hw, W.hb, 1, 1));
    var cc = sig(conv(x.d, x.h, x.w, x.c, W.cw, W.cb, 3, 1));
    return { h: hh, c: cc };
  }

  /* ---------------- 噪声 ---------------- */
  var seedMap = 1;
  function h2(x, y, s) {
    var n = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 362437);
    n = Math.imul(n ^ (n >>> 13), 1274126177);
    return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
  }
  function sm(t) { return t * t * (3 - 2 * t); }
  function noise2(x, y, s) {
    var xi = Math.floor(x), yi = Math.floor(y);
    var xf = sm(x - xi), yf = sm(y - yi);
    var a = h2(xi, yi, s), b = h2(xi + 1, yi, s), c = h2(xi, yi + 1, s), d = h2(xi + 1, yi + 1, s);
    return (a + (b - a) * xf) * (1 - yf) + (c + (d - c) * xf) * yf;
  }
  function fbm(x, y, s) {
    return noise2(x, y, s) * 0.62 + noise2(x * 2.1, y * 2.1, s + 17) * 0.26 + noise2(x * 4.3, y * 4.3, s + 41) * 0.12;
  }

  /* ---------------- 世界 ---------------- */
  var photoPix = null, lastAvg = [0.4, 0.45, 0.4];
  var photoHi = null;
  var skyTop = [40, 52, 72], skyHor = [190, 186, 178], horizFrac = 0.55;

  function analyzePhoto(px) {
    var rows = [], y, x, o;
    for (y = 0; y < 96; y++) {
      var rr = 0, gg = 0, bb = 0;
      for (x = 0; x < 96; x++) { o = (y * 96 + x) * 4; rr += px[o]; gg += px[o + 1]; bb += px[o + 2]; }
      rows.push([rr / 96, gg / 96, bb / 96]);
    }
    var tr = 0, tg = 0, tb = 0;
    for (y = 0; y < 6; y++) { tr += rows[y][0]; tg += rows[y][1]; tb += rows[y][2]; }
    tr /= 6; tg /= 6; tb /= 6;

    // 天空通常更亮、更平；地面更暗、纹理更多。用「亮度下降 + 纹理上升」联合判定地平线
    var lum = [], vari = [];
    for (y = 0; y < 96; y++) {
      var lr = 0, lv = 0;
      for (x = 0; x < 96; x++) {
        o = (y * 96 + x) * 4;
        lr += (px[o] * 0.299 + px[o + 1] * 0.587 + px[o + 2] * 0.114);
      }
      lr /= 96;
      for (x = 0; x < 96; x++) {
        o = (y * 96 + x) * 4;
        var ll = px[o] * 0.299 + px[o + 1] * 0.587 + px[o + 2] * 0.114;
        lv += (ll - lr) * (ll - lr);
      }
      lum.push(lr); vari.push(Math.sqrt(lv / 96));
    }
    var bestY = -1, bestScore = -1e9;
    for (y = 14; y < 86; y++) {
      var upL = (lum[y - 5] + lum[y - 4] + lum[y - 3]) / 3;
      var dnL = (lum[y + 1] + lum[y + 2] + lum[y + 3]) / 3;
      var upV = (vari[y - 5] + vari[y - 4] + vari[y - 3]) / 3;
      var dnV = (vari[y + 1] + vari[y + 2] + vari[y + 3]) / 3;
      var sc = (upL - dnL) * 0.9 + (dnV - upV) * 1.6;
      // 略偏向画面中下部（大多数照片地平线在中间偏下）
      sc += (y / 96) * 6;
      if (sc > bestScore) { bestScore = sc; bestY = y; }
    }
    var hz = bestScore > 6 ? (bestY / 96) : 0.56;
    horizFrac = Math.max(0.18, Math.min(0.86, hz));
    skyTop = [tr | 0, tg | 0, tb | 0];
    var hy = Math.max(1, Math.round(hz * 96) - 5);
    var ar = 0, ag = 0, ab = 0, n = 0;
    for (y = Math.max(0, hy - 4); y < hy; y++) { ar += rows[y][0]; ag += rows[y][1]; ab += rows[y][2]; n++; }
    if (n) skyHor = [ar / n | 0, ag / n | 0, ab / n | 0];
  }
  var TANF = Math.tan(1.15 / 2);
  var voxTotal = 0;

  function samplePhoto(u, v, out) {
    var src = photoHi || photoPix, n = photoHi ? 255 : 95;
    var px = Math.round(u * n), py = Math.round(v * n);
    if (px < 0) px = 0; if (px > n) px = n;
    if (py < 0) py = 0; if (py > n) py = n;
    var o = (py * (n + 1) + px) * 3;
    out[0] = src[o]; out[1] = src[o + 1]; out[2] = src[o + 2];
  }

  function bilinH(PH, r, c) {
    r = r < 0 ? 0 : (r > PATCH - 1.001 ? PATCH - 1.001 : r);
    c = c < 0 ? 0 : (c > PATCH - 1.001 ? PATCH - 1.001 : c);
    var r0 = r | 0, c0 = c | 0, fr = r - r0, fc = c - c0;
    var a = PH[r0 * PATCH + c0], b = PH[r0 * PATCH + c0 + 1];
    var d = PH[(r0 + 1) * PATCH + c0], e = PH[(r0 + 1) * PATCH + c0 + 1];
    return (a + (b - a) * fc) * (1 - fr) + (d + (e - d) * fc) * fr;
  }

  function buildWorld(PH, PC, avg) {
    var x, z, i;
    var tmpc = [0, 0, 0];
    var playerH = PH[PATCH_ROW * PATCH + 12];

    for (z = 0; z < WORLD; z++) {
      for (x = 0; x < WORLD; x++) {
        i = z * WORLD + x;
        var r = PATCH_ROW - (PZ - z) / SCALE;
        var c = (x - PX) / SCALE + 11.5;
        var inside = (r >= -0.5 && r < PATCH && c >= -0.5 && c < PATCH);

        var hg, wgt = 0;
        if (inside) {
          hg = bilinH(PH, r, c);
        } else {
          var dr = r < 0 ? -r : (r > PATCH - 1 ? r - (PATCH - 1) : 0);
          var dc = c < 0 ? -c : (c > PATCH - 1 ? c - (PATCH - 1) : 0);
          var outD = Math.sqrt(dr * dr + dc * dc) * SCALE;
          wgt = Math.min(1, Math.max(0, (outD - 3) / 40));
          wgt = wgt * wgt * (3 - 2 * wgt);
          hg = bilinH(PH, r, c) * (1 - wgt) + (3 + fbm(x * 0.012, z * 0.012, seedMap) * 16) * wgt;
        }

        var distP = Math.sqrt((x - PX) * (x - PX) + (z - PZ) * (z - PZ));
        var det = (fbm(x * 0.085, z * 0.085, seedMap + 3) - 0.5) * 2.6 +
                  (fbm(x * 0.26, z * 0.26, seedMap + 8) - 0.5) * 1.3 +
                  (fbm(x * 0.62, z * 0.62, seedMap + 21) - 0.5) * 0.55;
        var hh = hg + det * (0.85 + Math.min(1, distP / 110) * 1.1);

        if (distP < 22) hh = hh * (distP / 22) + playerH * (1 - distP / 22);

        hh = Math.max(1, Math.min(HMAX, Math.round(hh)));
        baseH[i] = hh;
        heights[i] = hh;

        var da = 18 - r; if (da < 0) da = -da; if (da < 1.6) da = 1.6;
        var uu = 0.5 + ((c - 11.5) / da) / (2 * TANF);
        var vv = 0.5 + (1.7 / da) / (2 * TANF);
        samplePhoto(uu, vv, tmpc);

        var mc = Math.min(PATCH - 1, Math.max(0, Math.round(c)));
        var ps = (mr * PATCH + mc) * 3;
        var jit = 0.9 + h2(x, z, seedMap + 5) * 0.2;
        var cr2 = (PC[ps] * 0.3 + tmpc[0] * 0.7) * 1.12 + 0.05;
        var cg2 = (PC[ps + 1] * 0.3 + tmpc[1] * 0.7) * 1.12 + 0.05;
        var cb2 = (PC[ps + 2] * 0.3 + tmpc[2] * 0.7) * 1.12 + 0.05;
        if (wgt > 0) {

          cg2 = cg2 * (1 - wgt) + (avg[1] * 1.1 + 0.05) * wgt;
          cb2 = cb2 * (1 - wgt) + (avg[2] * 1.1 + 0.05) * wgt;

        cG0[i] = Math.min(255, cg2 * jit * 255);

  /* ---------------- 实时变化 ---------------- */

  function driftStep(dt) {
    if (!live) return;
    // 混乱度越高：梦境场演化更快、空间频率更高、每次改写的地块更多、幅度更大
    tick += dt * (0.5 + chaos * 3.0);
    var rate = (1 - mem) * 2.2;
    if (rate <= 0.001 && chaos <= 0.002) return;

    var anchor = mem;
    var amp = Math.pow(chaos, 0.85) * 21 * (0.24 + (1 - anchor) * 0.76);
    var devLim = 9 + (1 - anchor) * 12;
    var freq = 0.015 + chaos * 0.095;
    var k = Math.min(0.6, dt * (0.32 + rate * (0.7 + chaos * 2.6)));
    var perTick = Math.round(5000 + chaos * 26000);
    var tintAmp = chaos * 0.42;

    var end = Math.min(WORLD * WORLD, cursor + perTick);
    for (var i = cursor; i < end; i++) {
      var x = i % WORLD, z = (i / WORLD) | 0;
      var cur = heights[i];
      var nz2 = (fbm(x * freq + tick * 0.55, z * freq - tick * 0.45, seedMap + 77) - 0.5) * 2
              + (fbm(x * 0.022 - tick * 0.25, z * 0.022 + tick * 0.3, seedMap + 133) - 0.5)
              + (fbm(x * 0.30 + tick * 1.7, z * 0.30 + tick * 1.3, seedMap + 311) - 0.5) * 2 * (1 - anchor) * 1.8;
      // 离玩家越近越稳（脚下不该突然变成墙），远处随便乱
      var ddx = x - cam.x, ddz = z - cam.z;
      var dd = Math.sqrt(ddx * ddx + ddz * ddz);
      var nf = dd < 30 ? (0.26 + 0.74 * (dd / 30)) : 1;
      var tgt = baseH[i] * anchor + cur * (1 - anchor) + nz2 * amp * nf;
      // 相对"照片记忆"的偏移设上限，混乱拉满也不会塌成墙阵
      var lo = baseH[i] - devLim, hi = baseH[i] + devLim;
      if (tgt < lo) tgt = lo;
      if (tgt > hi) tgt = hi;
      if (tgt < 1) tgt = 1;
      if (tgt > HMAX) tgt = HMAX;
      var nv = cur + (tgt - cur) * k * (0.55 + 0.45 * nf);
      if (Math.abs(nv - cur) > 0.4) chgAcc++;
      heights[i] = nv;

      // 混乱度高时，颜色也跟着重新想象（大尺度色偏，不是噪点）
      if (tintAmp > 0.01) {
        var t2 = 1 + (fbm(x * 0.018 + tick * 0.22, z * 0.018 - tick * 0.19, seedMap + 555) - 0.5) * 2 * tintAmp;
        var t3 = 1 + (fbm(x * 0.05 - tick * 0.4, z * 0.05 + tick * 0.35, seedMap + 606) - 0.5) * 1.4 * tintAmp;
        cR[i] = Math.min(255, cR0[i] * t2);
        cG[i] = Math.min(255, cG0[i] * t2 * t3);
        cB[i] = Math.min(255, cB0[i] * t3);
      }

  }

    var H = RH, Wd = RW, buf = buf32;
    var horizon = H * 0.5 + pitch * projScale;

    var hR = skyHor[0], hG = skyHor[1], hB = skyHor[2];
    for (var y = 0; y < H; y++) {
      var t = (y - horizon) / H, r2, g2, b2;
      if (t < 0) {
        var kk = Math.min(1, -t * 1.55);
        r2 = hR + (skyTop[0] - hR) * kk;

      } else {

      r2 = r2 < 0 ? 0 : (r2 > 255 ? 255 : r2);
      g2 = g2 < 0 ? 0 : (g2 > 255 ? 255 : g2);

    for (var sx = 0; sx < Wd; sx++) {

        var h = heights[idx];

          var rr = cR[idx] * sh * (1 - fog) + hR * fog;
          var gg = cG[idx] * sh * (1 - fog) + hG * fog;
          var bb = cB[idx] * sh * (1 - fog) + hB * fog;

          if (gg > 255) gg = 255;
          if (bb > 255) bb = 255;

  });
  ['dragleave', 'drop'].forEach(function (n) {
    drop.addEventListener(n, function (e) { e.preventDefault(); drop.classList.remove('over'); });
  });
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('drop', function (e) {
    e.preventDefault();
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]);
  });
  window.addEventListener('paste', function (e) {
    var it = e.clipboardData && e.clipboardData.items;
    if (!it) return;
    for (var i = 0; i < it.length; i++) if (it[i].type.indexOf('image') === 0) readFile(it[i].getAsFile());
  });

  var exWrap = document.getElementById('examples');
  EXAMPLES.forEach(function (src) {
    var im = new Image();
    im.src = src;
    im.addEventListener('click', function () { pickSample(src); });
    exWrap.appendChild(im);
  });

  var sw = document.getElementById('sw');
  var sliders = document.getElementById('sliders');
  var dot = document.getElementById('dot');
  var badgeTxt = document.getElementById('badgeTxt');
  function setLive(v) {
    live = !!v;
    sw.className = 'sw' + (live ? ' on' : '');
    sliders.className = live ? '' : 'off';
    dot.className = live ? 'live' : '';
    badgeTxt.textContent = live ? 'PHOTO → WORLD · 实时变化中' : 'PHOTO → WORLD · 本地模型';
  }
  sw.addEventListener('click', function () { setLive(!live); });

  var rc = document.getElementById('r-chaos'), rm = document.getElementById('r-mem');
  rc.addEventListener('input', function () {
    chaos = +rc.value / 100;
    document.getElementById('v-chaos').textContent = chaos.toFixed(2);
  });
  rm.addEventListener('input', function () {
    mem = +rm.value / 100;
    document.getElementById('v-mem').textContent = mem.toFixed(2);
  });
  document.getElementById('v-chaos').textContent = chaos.toFixed(2);
  document.getElementById('v-mem').textContent = mem.toFixed(2);

  document.getElementById('again').addEventListener('click', function () {
    started = false;
    fadeOn = false; fadeA = 0;
    fadeEl.style.opacity = '0';
    hud.style.display = 'none';
    panel.style.display = 'flex';
    if (document.pointerLockElement) document.exitPointerLock();
  });

  var qc = location.search.match(/chaos=([0-9.]+)/);
  if (qc) { chaos = Math.max(0, Math.min(1, parseFloat(qc[1]))); rc.value = Math.round(chaos * 100); document.getElementById('v-chaos').textContent = chaos.toFixed(2); }
  var qm = location.search.match(/mem=([0-9.]+)/);
  if (qm) { mem = Math.max(0, Math.min(1, parseFloat(qm[1]))); rm.value = Math.round(mem * 100); document.getElementById('v-mem').textContent = mem.toFixed(2); }

  var m = location.search.match(/ex=([0-9])/);
  if (m) setTimeout(function () { pickSample(EXAMPLES[+m[1] % EXAMPLES.length]); }, 260);


})();
</script>
</body>
</html>

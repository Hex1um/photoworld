# s1_base 的「省时」变体：三项零算法风险优化全部打开，权重与 s1_base 同构，
# checkpoint 可与 s1_base 互读（只改数据路径与调度节奏）。
#   node … 无；训练：python -m worldmodel.train --config configs/s1_fast.yaml
# 相对 s1_base 的变化：
#   data.prefer_latent     预编码 latent 分片直读，训练循环内 0 次 VAE encode
#   train.val_max_samples  验证固定 64 条子集（曲线方差更小，验证开销 -88%）
#   train.ema_every        每 4 步更新 EMA（衰减按 4 次方补偿，行为等价）
#
# v1.26 追加的吞吐开关（全部 opt-in，下面都注释掉 = 保持旧行为）：
#   model.pad_to_multiple: 64        L=2305 → 2368，dummy 列不被有效 token 看见
#   train.activation_checkpointing: true   重算 12 个 Block 的中间激活，换更大 batch
#   train.num_workers: 4 / prefetch_factor: 2 / pin_memory: true / persistent_workers: true
#   train.compile: true / compile_mode: reduce-overhead
#   train.fused_adam: true           CUDA 下默认已开，数学等价
# 这些项只改系统级调度，不改权重形状 / checkpoint 键 / 损失 / CFG；
# 但 padding 会改变 bf16 kernel 分块，收益与数值需在训练机 A/B 后确认，
# 本机无 torch/CUDA，一律标「解析估算、未实测」。
data:
  shard_dir: data/wm
  prefer_latent: true
  width: 384
  height: 256
  n_hist: 4
  vae: stabilityai/sd-vae-ft-mse
  val_ratio: 0.1
model:
  dim: 768
  depth: 12
  heads: 12
train:
  out: runs/s1_fast
  steps: 2000
  batch_size: 2
  grad_accum: 16
  lr: 1.5e-4
  warmup: 100
  clip: 1.0
  ema: 0.999
  ema_every: 4
  drop_cond: 0.1
  hist_noise_prob: 0.5
  hist_noise_sigma: 0.3
  val_every: 500
  val_max_samples: 64
  log_every: 20

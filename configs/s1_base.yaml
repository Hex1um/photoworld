seed: 0
data:
  shard_dir: data/wm
  width: 384
  height: 256
  n_hist: 4
  vae: stabilityai/sd-vae-ft-mse
  val_ratio: 0.1
model:
  dim: 768
  depth: 12
  heads: 12
train:
  out: runs/s1_base
  steps: 2000
  batch_size: 2
  grad_accum: 16
  lr: 1.5e-4
  warmup: 100
  clip: 1.0
  ema: 0.999
  drop_action: 0.1
  drop_init: 0.1
  hist_noise_prob: 0.5
  hist_noise_sigma: 0.3
  log_every: 20
  val_every: 500

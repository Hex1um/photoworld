data:
  action_scale:
  - 30.0
  - 30.0
  - 30.0
  - 2.1
  - 28.0
  - 2.1
  - 30.0
  height: 256
  n_hist: 4
  shard_dir: data/wm2
  vae: stabilityai/sd-vae-ft-mse
  val_ratio: 0.1
  width: 384
model:
  depth: 12
  dim: 768
  heads: 12
seed: 0
train:
  batch_size: 2
  clip: 1.0
  drop_action: 0.1
  drop_init: 0.1
  ema: 0.999
  grad_accum: 1
  hist_noise_prob: 0.5
  hist_noise_sigma: 0.3
  log_every: 100
  lr: 0.00015
  out: runs/s3
  resume: true
  scheduled_sampling: 0.5
  steps: 1500
  val_every: 250
  warmup: 100
